<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CISSP Quiz</title>
<style>
body { font-family: Arial; padding:20px; background:#f4f4f4; }
h2 { margin-bottom:10px; }
.qcard { background:white; padding:15px; margin-bottom:15px; border-radius:8px; }
button { padding:8px; margin:5px 0; display:block; width:100%; cursor:pointer; }
.correct { background:#d4edda; }
.wrong { background:#f8d7da; }
#final { display:none; background:white; padding:20px; margin-top:20px; border-radius:8px; }
input { padding:8px; width:100%; margin-bottom:15px; }
.reportCard { background:#fff3f3; padding:15px; margin-bottom:15px; border-radius:8px; }
.green { color:green; font-weight:bold; }
.red { color:red; font-weight:bold; }
.downloadBtn { margin-top:15px; background:#007bff; color:white; border:none; }
</style>
</head>
<body>

<h2>CISSP Quiz</h2>

<label>Student Name:</label>
<input type="text" id="studentName" placeholder="Enter student name">

<div id="quiz"></div>

<div id="final">
<h3>Result Summary</h3>
<p id="summary"></p>
<div id="wrongReport"></div>
<button class="downloadBtn" onclick="downloadResult()">Download Filled Result</button>
</div>

<script>

const Q = [
{
q:"Which framework applies to credit card processing?",
opts:["ISO 27001","NIST 800-53","PCI DSS","SOC 2"],
ans:2
},
{
q:"What is Privacy by Design?",
opts:[
"Encrypt after collection",
"Build privacy from start",
"Publish privacy policy",
"Hire DPO"
],
ans:1
},
{
q:"What is quantitative risk output?",
opts:[
"High/Medium/Low",
"Heat Map",
"ALE = $240,000",
"Risk Register"
],
ans:2
}
];

let correct = 0;
let wrong = 0;
let answered = 0;
let answerLog = [];

function buildQuiz(){
const wrap = document.getElementById("quiz");
wrap.innerHTML = "";

Q.forEach((q,i)=>{
let card = document.createElement("div");
card.className="qcard";

let question = document.createElement("h4");
question.innerText = (i+1)+". "+q.q;
card.appendChild(question);

q.opts.forEach((opt,j)=>{
let btn=document.createElement("button");
btn.innerText=opt;
btn.onclick=()=>pick(i,j,btn);
card.appendChild(btn);
});

wrap.appendChild(card);
});
}

function pick(qi,sel,btn){

let name=document.getElementById("studentName").value.trim();
if(name===""){
alert("Enter student name first");
return;
}

let q=Q[qi];
let buttons=btn.parentElement.querySelectorAll("button");

buttons.forEach((b,index)=>{
b.disabled=true;
if(index===q.ans){
b.classList.add("correct");
}
if(index===sel && sel!==q.ans){
b.classList.add("wrong");
}
});

answerLog.push({
questionNumber:qi+1,
questionText:q.q,
options:q.opts,
selected:sel,
correct:q.ans
});

if(sel===q.ans) correct++;
else wrong++;

answered++;

if(answered===Q.length){
showFinal();
}
}

function showFinal(){

document.getElementById("final").style.display="block";

let name=document.getElementById("studentName").value;
let percent=Math.round((correct/Q.length)*100);

document.getElementById("summary").innerText=
"Student: "+name+
" | Correct: "+correct+
" | Wrong: "+wrong+
" | Score: "+percent+"%";

let reportDiv=document.getElementById("wrongReport");
reportDiv.innerHTML="";

answerLog.forEach(r=>{
if(r.selected!==r.correct){

let div=document.createElement("div");
div.className="reportCard";

let html="<p><strong>Q"+r.questionNumber+":</strong> "+r.questionText+"</p>";
html+="<p class='red'>You Selected: "+r.options[r.selected]+" (WRONG)</p>";
html+="<p class='green'>Correct Answer: "+r.options[r.correct]+"</p>";

div.innerHTML=html;
reportDiv.appendChild(div);
}
});
}

function downloadResult(){

let name=document.getElementById("studentName").value;
let percent=Math.round((correct/Q.length)*100);

let htmlContent = `
<html>
<head>
<title>Quiz Result</title>
<style>
body{font-family:Arial;padding:20px;}
.green{color:green;font-weight:bold;}
.red{color:red;font-weight:bold;}
.reportCard{background:#fff3f3;padding:15px;margin-bottom:15px;border-radius:8px;}
</style>
</head>
<body>
<h2>CISSP Quiz Result</h2>
<p><strong>Student:</strong> ${name}</p>
<p><strong>Score:</strong> ${correct}/${Q.length} (${percent}%)</p>
<h3>Wrong Answers</h3>
`;

answerLog.forEach(r=>{
if(r.selected!==r.correct){
htmlContent+=`
<div class="reportCard">
<p><strong>Q${r.questionNumber}:</strong> ${r.questionText}</p>
<p class="red">You Selected: ${r.options[r.selected]} (WRONG)</p>
<p class="green">Correct Answer: ${r.options[r.correct]}</p>
</div>
`;
}
});

htmlContent+="</body></html>";

let blob=new Blob([htmlContent],{type:'text/html'});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=name+"_Quiz_Result.html";
link.click();
}

buildQuiz();

</script>
</body>
</html>
